[package]
name = "gaiadesk"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The official Rust SDK for the GaiaDesk Platform API: desks, exec with streamed output, files, jobs, stats, scoped tokens, webhooks and support sessions, with end-to-end encrypted desk operations."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Gaia-Desk/gaiadesk-rust"
homepage = "https://github.com/Gaia-Desk/gaiadesk-rust"
documentation = "https://docs.rs/gaiadesk"
readme = "README.md"
keywords = ["gaiadesk", "remote-desktop", "api", "sdk", "e2e"]
categories = ["api-bindings", "network-programming", "cryptography"]
include = [
    "/src/**/*.rs",
    "/examples/**/*.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/Cargo.toml",
]

[features]
default = ["local", "lan"]
## The `local` transport: the desk's own /v1 API over its Unix socket or Windows named pipe.
local = []
## The `lan` transport: a desk's LAN gateway over TLS pinned to its certificate's SHA-256.
lan = ["dep:rustls"]
## A blocking client (`gaiadesk::blocking`) that runs the async one on its own Tokio runtime.
blocking = ["tokio/rt"]

[dependencies]
base64 = "0.22"
bytes = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hkdf = "0.12"
hmac = "0.12"
percent-encoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.38", default-features = false, features = ["time", "fs", "io-util", "sync"] }
x25519-dalek = { version = "2", default-features = false, features = ["alloc", "precomputed-tables", "zeroize", "static_secrets"] }
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.38", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "local"
required-features = ["local"]

[[example]]
name = "lan"
required-features = ["lan"]

[[example]]
name = "blocking"
required-features = ["blocking"]
